<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard - Tuition Management</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding: 24px; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .card { background: #1e2635; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .stat { background: #121a29; border-radius: 8px; padding: 12px; }
    .stat h3 { margin: 0 0 6px; color: #cfa668; font-size: 0.9rem; }
    .stat p { margin: 0; font-size: 1.2rem; font-weight: 700; }
    .form-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border-bottom: 1px solid #2f3a50; padding: 10px; text-align: left; }
    th { color: #cfa668; }
    .status { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
      <h1>Teacher Dashboard</h1>
      <div>
        <a href="/" class="btn btn-secondary">Home</a>
        <button id="teacher-logout-btn" class="btn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2>Overview</h2>
      <div id="teacher-stats" class="grid"></div>
      <p id="teacher-main-status" class="status"></p>
    </div>

    <div class="card">
      <h2>Create Class</h2>
      <form id="create-class-form" class="form-grid">
        <select name="course_id" id="course-select" required>
          <option value="">Select Course</option>
        </select>
        <input type="text" name="class_title" placeholder="Class Title" required />
        <input type="text" name="schedule_text" placeholder="Schedule (e.g., Sun-Tue 7PM)" required />
        <input type="number" name="fee" min="1" step="0.01" placeholder="Fee" required />
        <button class="btn btn-primary" type="submit">Create Class</button>
      </form>
      <p id="create-class-status" class="status"></p>
    </div>

    <div class="card">
      <h2>My Classes</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Course</th>
            <th>Schedule</th>
            <th>Fee</th>
            <th>Students</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="classes-body"></tbody>
      </table>
      <p id="classes-status" class="status"></p>
    </div>

    <div class="card">
      <h2>Class Students</h2>
      <p>Selected Class ID: <strong id="selected-class-id">None</strong></p>
      <table>
        <thead>
          <tr>
            <th>Enrollment ID</th>
            <th>Student</th>
            <th>Status</th>
            <th>Email / Phone</th>
          </tr>
        </thead>
        <tbody id="students-body"></tbody>
      </table>
      <p id="students-status" class="status"></p>
    </div>

    <div class="card">
      <h2>Record Attendance</h2>
      <form id="attendance-form" class="form-grid">
        <input type="number" name="class_id" id="attendance-class-id" placeholder="Class ID" required />
        <input type="number" name="enrollment_id" placeholder="Enrollment ID" required />
        <input type="date" name="attendance_date" required />
        <select name="status" required>
          <option value="">Status</option>
          <option value="present">Present</option>
          <option value="absent">Absent</option>
        </select>
        <button class="btn btn-primary" type="submit">Save Attendance</button>
      </form>
      <p id="attendance-status" class="status"></p>
    </div>

    <div class="card">
      <h2>Upload Marks</h2>
      <form id="marks-form" class="form-grid">
        <input type="number" name="class_id" id="marks-class-id" placeholder="Class ID" required />
        <input type="number" name="enrollment_id" placeholder="Enrollment ID" required />
        <input type="text" name="exam_title" placeholder="Exam Title" required />
        <input type="number" name="marks_obtained" step="0.01" min="0" placeholder="Marks Obtained" required />
        <input type="number" name="total_marks" step="0.01" min="1" placeholder="Total Marks" required />
        <button class="btn btn-primary" type="submit">Upload Marks</button>
      </form>
      <p id="marks-status" class="status"></p>
    </div>
  </div>

  <script src="/public/js/teacher-dashboard.js"></script>
</body>
</html>
